name: Build and Upload package to NuGet (GitHub Packages)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Add GitHub NuGet source with credentials
        run: |
          dotnet nuget add source https://nuget.pkg.github.com/Finly-app/index.json \
            --name github \
            --username ${{ github.actor }} \
            --password ${{ secrets.GH_PAT }} \
            --store-password-in-clear-text

      - name: Restore dependencies
        run: dotnet restore

      - name: Build the solution
        run: dotnet build --no-restore --configuration Release

      - name: Generate version number
        id: version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "Using version: $VERSION"
          echo "PACKAGE_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Pack the NuGet package
        run: |
          dotnet pack ./Shared.Contracts/Shared.Contracts.csproj \
            -c Release \
            -p:PackageVersion=${{ env.PACKAGE_VERSION }} \
            --output ./nupkg

      - name: Push to GitHub Packages (NuGet)
        run: |
